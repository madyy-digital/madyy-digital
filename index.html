<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Madyy Digital - Diseño web, tiendas online, SEO y soluciones con IA para tu negocio. Trabaja con nosotros 100% remoto.">
    <title>Madyy Digital - Tu Negocio. Tu Presencia. Tu Éxito.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeInUp {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        function MadyyDigital() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [activeTab, setActiveTab] = useState('eur');
            const [formData, setFormData] = useState({
                nombre: '',
                email: '',
                empresa: '',
                pais: '',
                servicio: '',
                presupuesto: '',
                descripcion: ''
            });
            const [formSubmitted, setFormSubmitted] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const handleFormChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                if (formData.nombre && formData.email && formData.empresa) {
                    setFormSubmitted(true);
                    setTimeout(() => {
                        setFormData({ nombre: '', email: '', empresa: '', pais: '', servicio: '', presupuesto: '', descripcion: '' });
                        setFormSubmitted(false);
                    }, 3000);
                }
            };

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                element?.scrollIntoView({ behavior: 'smooth' });
                setIsMenuOpen(false);
            };

            return (
                <div className="bg-white text-gray-900 overflow-x-hidden">
                    {/* Navbar */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white shadow-2xl backdrop-blur-md' : 'bg-white/80 backdrop-blur-md'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex justify-between items-center">
                                <div className="text-2xl font-bold bg-gradient-to-r from-blue-600 via-purple-600 to-blue-700 bg-clip-text text-transparent">
                                    Madyy Digital
                                </div>
                                
                                <div className="hidden md:flex gap-8 text-sm font-medium">
                                    <button onClick={() => scrollToSection('inicio')} className="hover:text-blue-600 transition duration-200">Inicio</button>
                                    <button onClick={() => scrollToSection('servicios')} className="hover:text-blue-600 transition duration-200">Servicios</button>
                                    <button onClick={() => scrollToSection('precios')} className="hover:text-blue-600 transition duration-200">Precios</button>
                                    <button onClick={() => scrollToSection('portfolio')} className="hover:text-blue-600 transition duration-200">Portfolio</button>
                                    <button onClick={() => scrollToSection('ia')} className="hover:text-blue-600 transition duration-200">IA</button>
                                    <button onClick={() => scrollToSection('contacto')} className="hover:text-blue-600 transition duration-200">Contacto</button>
                                </div>

                                <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    {isMenuOpen ? '✕' : '☰'}
                                </button>
                            </div>

                            {isMenuOpen && (
                                <div className="md:hidden mt-4 pb-4 space-y-3 border-t pt-4">
                                    <button onClick={() => scrollToSection('inicio')} className="block w-full text-left py-2 hover:text-blue-600">Inicio</button>
                                    <button onClick={() => scrollToSection('servicios')} className="block w-full text-left py-2 hover:text-blue-600">Servicios</button>
                                    <button onClick={() => scrollToSection('precios')} className="block w-full text-left py-2 hover:text-blue-600">Precios</button>
                                    <button onClick={() => scrollToSection('portfolio')} className="block w-full text-left py-2 hover:text-blue-600">Portfolio</button>
                                    <button onClick={() => scrollToSection('ia')} className="block w-full text-left py-2 hover:text-blue-600">IA</button>
                                    <button onClick={() => scrollToSection('contacto')} className="block w-full text-left py-2 hover:text-blue-600">Contacto</button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* HERO */}
                    <section id="inicio" className="pt-32 pb-32 px-4 sm:px-6 lg:px-8 bg-gradient-to-br from-gray-50 via-blue-50 to-purple-50 relative overflow-hidden">
                        <div className="max-w-5xl mx-auto text-center relative z-10">
                            <div className="inline-block mb-6 px-4 py-2 bg-blue-100/80 rounded-full text-sm font-semibold text-blue-700">
                                Bienvenido a Madyy Digital
                            </div>
                            
                            <h1 className="text-6xl md:text-8xl font-bold mb-8 text-gray-900 leading-tight">
                                Tu negocio.<br />Tu presencia.<br />Tu éxito.
                            </h1>
                            
                            <p className="text-xl md:text-2xl text-gray-600 mb-12 max-w-2xl mx-auto leading-relaxed font-light">
                                Creamos páginas web modernas, soluciones con IA y automatizaciones que ayudan a tu negocio a crecer.
                            </p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 justify-center mb-16">
                                <button onClick={() => scrollToSection('servicios')} className="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-10 py-4 rounded-xl font-bold hover:shadow-2xl hover:scale-105 transition duration-300">
                                    Quiero mi página web
                                </button>
                                <button onClick={() => scrollToSection('contacto')} className="border-2 border-blue-600 text-blue-600 px-10 py-4 rounded-xl font-bold hover:bg-blue-50 hover:shadow-lg transition duration-300">
                                    Solicitar presupuesto
                                </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 text-sm font-semibold text-gray-700 bg-white/50 backdrop-blur p-8 rounded-2xl">
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    Diseño personalizado
                                </div>
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    Responsive
                                </div>
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    SEO
                                </div>
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    Soporte
                                </div>
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    Trabajo remoto
                                </div>
                                <div className="flex items-center gap-3 justify-center">
                                    <div className="w-2 h-2 bg-green-500 rounded-full"></div>
                                    España y Estados Unidos
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* SERVICIOS */}
                    <section id="servicios" className="py-32 px-4 sm:px-6 lg:px-8 bg-white">
                        <div className="max-w-6xl mx-auto">
                            <div className="text-center mb-20">
                                <h2 className="text-5xl md:text-6xl font-bold mb-6 text-gray-900">Nuestros Servicios</h2>
                                <p className="text-xl text-gray-600 max-w-2xl mx-auto">Soluciones completas para que tu negocio brille en internet</p>
                            </div>
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-5 gap-8">
                                {[
                                    { title: 'Diseño web', desc: 'Páginas modernas y adaptadas a móviles.', price: 'Desde 299 €' },
                                    { title: 'Web profesional', desc: 'Diseño personalizado, hasta 10 páginas, formularios, Google Maps, redes sociales, SEO y optimización.', price: 'Desde 599 €' },
                                    { title: 'Tienda online', desc: 'Productos, carrito, pagos, diseño responsive y SEO.', price: 'Desde 899 €' },
                                    { title: 'Mantenimiento', desc: 'Actualizaciones, copias de seguridad, seguridad y soporte.', price: '59 €/mes' },
                                    { title: 'IA y automatización', desc: 'Chatbots, asistentes virtuales, emails automáticos, reservas y automatización de tareas.', price: 'Desde 299 €' }
                                ].map((service, i) => (
                                    <div key={i} className="group relative bg-white p-8 rounded-2xl border border-gray-100 hover:shadow-2xl transition duration-500 overflow-hidden">
                                        <h3 className="font-bold text-lg mb-3 text-gray-900">{service.title}</h3>
                                        <p className="text-sm text-gray-600 mb-6 leading-relaxed">{service.desc}</p>
                                        <p className="font-bold text-lg text-blue-600">{service.price}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* PRECIOS */}
                    <section id="precios" className="py-32 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-gray-50 to-white">
                        <div className="max-w-6xl mx-auto">
                            <div className="text-center mb-20">
                                <h2 className="text-5xl md:text-6xl font-bold mb-6 text-gray-900">Planes de Precios</h2>
                                <p className="text-xl text-gray-600">Elige el plan que mejor se adapte a tu negocio</p>
                            </div>
                            
                            <div className="flex justify-center gap-4 mb-16">
                                <button 
                                    onClick={() => setActiveTab('eur')}
                                    className={`px-8 py-3 rounded-xl font-bold transition duration-300 ${activeTab === 'eur' ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`}
                                >
                                    España - EUR
                                </button>
                                <button 
                                    onClick={() => setActiveTab('usd')}
                                    className={`px-8 py-3 rounded-xl font-bold transition duration-300 ${activeTab === 'usd' ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'}`}
                                >
                                    Estados Unidos - USD
                                </button>
                            </div>

                            {activeTab === 'eur' && (
                                <div className="grid md:grid-cols-3 gap-8">
                                    {[
                                        { name: 'STARTER', price: '299 €', features: ['Hasta 5 páginas', 'Responsive', 'Contacto', 'SEO básico'], popular: false },
                                        { name: 'PROFESSIONAL', price: '599 €', features: ['Hasta 10 páginas', 'Diseño personalizado', 'SEO completo', 'Formularios', 'Google Maps', 'Redes sociales'], popular: true },
                                        { name: 'E-COMMERCE', price: '899 €', features: ['Tienda online', 'Productos', 'Carrito de compras', 'Pasarela de pagos', 'SEO'], popular: false }
                                    ].map((plan, i) => (
                                        <div key={i} className={`relative rounded-2xl transition duration-500 ${plan.popular ? 'bg-gradient-to-br from-blue-600 to-purple-600 shadow-2xl scale-105' : 'bg-white border border-gray-200 hover:shadow-xl'}`}>
                                            {plan.popular && (
                                                <div className="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-gray-900 px-6 py-2 rounded-full font-bold text-sm shadow-lg">
                                                    MAS POPULAR
                                                </div>
                                            )}
                                            <div className={`p-10 ${plan.popular ? 'text-white' : 'text-gray-900'}`}>
                                                <h3 className="text-2xl font-bold mb-4">{plan.name}</h3>
                                                <div className="text-5xl font-bold mb-8">{plan.price}</div>
                                                <ul className="space-y-4 mb-10">
                                                    {plan.features.map((feature, j) => (
                                                        <li key={j} className="flex items-start gap-3">
                                                            <span className={plan.popular ? 'text-yellow-300' : 'text-green-500'}>✓</span>
                                                            <span>{feature}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                                <button className={`w-full py-3 rounded-xl font-bold transition duration-300 ${plan.popular ? 'bg-yellow-400 text-gray-900 hover:bg-yellow-300' : 'border-2 border-blue-600 text-blue-600 hover:bg-blue-50'}`}>
                                                    Solicitar
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {activeTab === 'usd' && (
                                <div className="grid md:grid-cols-3 gap-8">
                                    {[
                                        { name: 'STARTER', price: '$399', features: ['Hasta 5 páginas', 'Responsive', 'Contacto', 'SEO básico'], popular: false },
                                        { name: 'PROFESSIONAL', price: '$799', features: ['Hasta 10 páginas', 'Diseño personalizado', 'SEO completo', 'Formularios', 'Google Maps', 'Redes sociales'], popular: true },
                                        { name: 'E-COMMERCE', price: '$1,199', features: ['Tienda online', 'Productos', 'Carrito de compras', 'Pasarela de pagos', 'SEO'], popular: false }
                                    ].map((plan, i) => (
                                        <div key={i} className={`relative rounded-2xl transition duration-500 ${plan.popular ? 'bg-gradient-to-br from-blue-600 to-purple-600 shadow-2xl scale-105' : 'bg-white border border-gray-200 hover:shadow-xl'}`}>
                                            {plan.popular && (
                                                <div className="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-gray-900 px-6 py-2 rounded-full font-bold text-sm shadow-lg">
                                                    MAS POPULAR
                                                </div>
                                            )}
                                            <div className={`p-10 ${plan.popular ? 'text-white' : 'text-gray-900'}`}>
                                                <h3 className="text-2xl font-bold mb-4">{plan.name}</h3>
                                                <div className="text-5xl font-bold mb-8">{plan.price}</div>
                                                <ul className="space-y-4 mb-10">
                                                    {plan.features.map((feature, j) => (
                                                        <li key={j} className="flex items-start gap-3">
                                                            <span className={plan.popular ? 'text-yellow-300' : 'text-green-500'}>✓</span>
                                                            <span>{feature}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                                <button className={`w-full py-3 rounded-xl font-bold transition duration-300 ${plan.popular ? 'bg-yellow-400 text-gray-900 hover:bg-yellow-300' : 'border-2 border-blue-600 text-blue-600 hover:bg-blue-50'}`}>
                                                    Solicitar
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </section>

                    {/* CONTACTO */}
                    <section id="contacto" className="py-32 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-blue-50 to-white">
                        <div className="max-w-3xl mx-auto">
                            <div className="text-center mb-16">
                                <h2 className="text-5xl md:text-6xl font-bold mb-6 text-gray-900">Listo para llevar tu negocio a Internet</h2>
                                <p className="text-xl text-gray-600">Contacta con nosotros y comenzamos tu transformación digital</p>
                            </div>
                            
                            {formSubmitted ? (
                                <div className="bg-gradient-to-br from-green-50 to-emerald-50 border-2 border-green-500 rounded-2xl p-12 text-center">
                                    <div className="text-7xl mb-6">OK</div>
                                    <h3 className="text-3xl font-bold text-green-700 mb-3">Formulario enviado</h3>
                                    <p className="text-green-600 text-lg">Nos pondremos en contacto pronto. Gracias por tu interés en Madyy Digital.</p>
                                </div>
                            ) : (
                                <form onSubmit={handleFormSubmit} className="bg-white p-12 rounded-2xl shadow-2xl space-y-8">
                                    <div className="grid md:grid-cols-2 gap-8">
                                        <input
                                            type="text"
                                            name="nombre"
                                            placeholder="Tu nombre"
                                            value={formData.nombre}
                                            onChange={handleFormChange}
                                            required
                                            className="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                        />
                                        <input
                                            type="email"
                                            name="email"
                                            placeholder="Tu email"
                                            value={formData.email}
                                            onChange={handleFormChange}
                                            required
                                            className="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                        />
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-8">
                                        <input
                                            type="text"
                                            name="empresa"
                                            placeholder="Nombre de tu empresa"
                                            value={formData.empresa}
                                            onChange={handleFormChange}
                                            required
                                            className="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                        />
                                        <select
                                            name="pais"
                                            value={formData.pais}
                                            onChange={handleFormChange}
                                            className="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                        >
                                            <option value="">Selecciona tu país</option>
                                            <option value="españa">España</option>
                                            <option value="usa">Estados Unidos</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                    </div>

                                    <textarea
                                        name="descripcion"
                                        placeholder="Cuéntanos sobre tu proyecto..."
                                        value={formData.descripcion}
                                        onChange={handleFormChange}
                                        rows="5"
                                        className="w-full px-6 py-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                    ></textarea>

                                    <div className="bg-blue-50 p-6 rounded-xl text-gray-700 font-semibold">
                                        Contacto directo: mardiathmoussa11@gmail.com
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-4 rounded-xl font-bold hover:shadow-2xl hover:scale-105 transition duration-300 text-lg"
                                    >
                                        Solicitar presupuesto
                                    </button>
                                </form>
                            )}
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="bg-gradient-to-b from-gray-900 to-black text-white py-20 px-4 sm:px-6 lg:px-8">
                        <div className="max-w-6xl mx-auto">
                            <div className="grid md:grid-cols-2 gap-16 mb-16 pb-16 border-b border-gray-800">
                                <div>
                                    <h3 className="text-3xl font-bold mb-3 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Madyy Digital</h3>
                                    <p className="text-gray-400 text-lg">Tu negocio. Tu presencia. Tu éxito.</p>
                                </div>
                                <div className="text-gray-400 text-lg">
                                    <p className="mb-3">Contacto: mardiathmoussa11@gmail.com</p>
                                    <p>España | Estados Unidos</p>
                                </div>
                            </div>

                            <div className="pt-8 border-t border-gray-800 text-center text-gray-500 text-sm">
                                <p>© 2024 Madyy Digital. Todos los derechos reservados.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MadyyDigital />);
    </script>
</body>
</html>
